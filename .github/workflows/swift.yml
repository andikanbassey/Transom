# Runs the unit tests (history format, version comparison), builds Transom the way a release is built (./build.sh), checks the app
# bundle, and keeps the zip as a downloadable artifact. UI checks are offscreen renders that need a display, so they are run by hand
# (see CLAUDE.md).

name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Unit tests
      run: swift test
    - name: Build the app and the zip
      run: ./build.sh zip
    - name: Check the bundle
      run: |
        codesign --verify --deep --strict build/Transom.app
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' build/Transom.app/Contents/Info.plist)" = "Transom"
        test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Transom.app/Contents/Info.plist)" = "com.studioab.drawer"
        test -f build/Transom.app/Contents/Resources/Transom.sdef
    - name: Keep the zip
      uses: actions/upload-artifact@v7
      with:
        name: Transom-${{ github.sha }}
        path: |
          build/Transom.zip
          build/Transom.zip.sha256
